name: CI

on:
  push:
    branches: [main, dev, "codex/**"]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Story trace
        run: pnpm story:trace

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Prisma generate
        run: pnpm --filter api prisma:generate

      - name: Build
        run: pnpm build

      - name: Export OpenAPI
        run: pnpm openapi:export
