name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter api prisma:generate

      - name: Build
        run: pnpm build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  release-source-guard:
    name: release-source-guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Only allow dev to release into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "main 只能接受 dev -> main 的发布 PR。当前来源分支: ${{ github.head_ref }}"
            exit 1
          fi

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image registry
        env:
          DEFAULT_IMAGE_NAMESPACE: ${{ github.repository }}
          PROD_IMAGE_REGISTRY: ${{ vars.PROD_IMAGE_REGISTRY }}
          PROD_IMAGE_NAMESPACE: ${{ vars.PROD_IMAGE_NAMESPACE }}
          PROD_API_IMAGE_REPOSITORY: ${{ vars.PROD_API_IMAGE_REPOSITORY }}
          PROD_WEB_STUDENT_IMAGE_REPOSITORY: ${{ vars.PROD_WEB_STUDENT_IMAGE_REPOSITORY }}
          PROD_WEB_ADMIN_IMAGE_REPOSITORY: ${{ vars.PROD_WEB_ADMIN_IMAGE_REPOSITORY }}
        run: |
          registry="${PROD_IMAGE_REGISTRY:-ghcr.io}"
          namespace="${PROD_IMAGE_NAMESPACE:-$DEFAULT_IMAGE_NAMESPACE}"
          api_repo="${PROD_API_IMAGE_REPOSITORY:-$registry/$namespace/api}"
          web_student_repo="${PROD_WEB_STUDENT_IMAGE_REPOSITORY:-$registry/$namespace/web-student}"
          web_admin_repo="${PROD_WEB_ADMIN_IMAGE_REPOSITORY:-$registry/$namespace/web-admin}"
          registry_host="${api_repo%%/*}"
          if [ "$registry_host" != "${web_student_repo%%/*}" ] || [ "$registry_host" != "${web_admin_repo%%/*}" ]; then
            echo "All production image repositories must use the same registry host."
            exit 1
          fi

          {
            echo "REGISTRY_HOST=$registry_host"
            echo "API_IMAGE_REPOSITORY=$api_repo"
            echo "WEB_STUDENT_IMAGE_REPOSITORY=$web_student_repo"
            echo "WEB_ADMIN_IMAGE_REPOSITORY=$web_admin_repo"
            echo "IMAGE_TAG=${{ github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Login to image registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.PROD_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.PROD_REGISTRY_PASSWORD }}
        run: |
          if [ "$REGISTRY_HOST" = "ghcr.io" ] && [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            exit 0
          fi

          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "Custom image registry requires PROD_REGISTRY_USERNAME and PROD_REGISTRY_PASSWORD secrets."
            exit 1
          fi

          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t "$API_IMAGE_REPOSITORY:$IMAGE_TAG" -t "$API_IMAGE_REPOSITORY:latest" .
          docker build -f apps/web-student/Dockerfile -t "$WEB_STUDENT_IMAGE_REPOSITORY:$IMAGE_TAG" -t "$WEB_STUDENT_IMAGE_REPOSITORY:latest" .
          docker build -f apps/web-admin/Dockerfile -t "$WEB_ADMIN_IMAGE_REPOSITORY:$IMAGE_TAG" -t "$WEB_ADMIN_IMAGE_REPOSITORY:latest" .

      - name: Smoke API image
        run: |
          network_name="ibooking-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mysql_name="${network_name}-mysql"
          container_id=""

          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker rm -f "$mysql_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network_name"
          docker run -d \
            --name "$mysql_name" \
            --network "$network_name" \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ibooking \
            mysql:8.4

          for _ in $(seq 1 90); do
            if docker exec "$mysql_name" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 1
          done

          if ! docker exec "$mysql_name" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
            docker logs "$mysql_name"
            exit 1
          fi

          container_id="$(docker run -d \
            --network "$network_name" \
            -p 3000:3000 \
            -e DATABASE_URL="mysql://root:root@$mysql_name:3306/ibooking" \
            "$API_IMAGE_REPOSITORY:$IMAGE_TAG")"

          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$API_IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$API_IMAGE_REPOSITORY:latest"
          docker push "$WEB_STUDENT_IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$WEB_STUDENT_IMAGE_REPOSITORY:latest"
          docker push "$WEB_ADMIN_IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$WEB_ADMIN_IMAGE_REPOSITORY:latest"

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image registry
        env:
          DEFAULT_IMAGE_NAMESPACE: ${{ github.repository }}
          PROD_IMAGE_REGISTRY: ${{ vars.PROD_IMAGE_REGISTRY }}
          PROD_IMAGE_NAMESPACE: ${{ vars.PROD_IMAGE_NAMESPACE }}
          PROD_API_IMAGE_REPOSITORY: ${{ vars.PROD_API_IMAGE_REPOSITORY }}
          PROD_WEB_STUDENT_IMAGE_REPOSITORY: ${{ vars.PROD_WEB_STUDENT_IMAGE_REPOSITORY }}
          PROD_WEB_ADMIN_IMAGE_REPOSITORY: ${{ vars.PROD_WEB_ADMIN_IMAGE_REPOSITORY }}
        run: |
          registry="${PROD_IMAGE_REGISTRY:-ghcr.io}"
          namespace="${PROD_IMAGE_NAMESPACE:-$DEFAULT_IMAGE_NAMESPACE}"
          api_repo="${PROD_API_IMAGE_REPOSITORY:-$registry/$namespace/api}"
          web_student_repo="${PROD_WEB_STUDENT_IMAGE_REPOSITORY:-$registry/$namespace/web-student}"
          web_admin_repo="${PROD_WEB_ADMIN_IMAGE_REPOSITORY:-$registry/$namespace/web-admin}"
          registry_host="${api_repo%%/*}"
          if [ "$registry_host" != "${web_student_repo%%/*}" ] || [ "$registry_host" != "${web_admin_repo%%/*}" ]; then
            echo "All production image repositories must use the same registry host."
            exit 1
          fi

          {
            echo "REGISTRY_HOST=$registry_host"
            echo "API_IMAGE_REPOSITORY=$api_repo"
            echo "WEB_STUDENT_IMAGE_REPOSITORY=$web_student_repo"
            echo "WEB_ADMIN_IMAGE_REPOSITORY=$web_admin_repo"
            echo "IMAGE_TAG=${{ github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Missing one or more required production secrets: PROD_SSH_USER, PROD_SSH_PRIVATE_KEY, PROD_DEPLOY_PATH"
            exit 1
          fi
          echo "Deploy host: ${PROD_SSH_HOST:-cd-server}"

      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          SSH_HOST="${PROD_SSH_HOST:-cd-server}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Login production registry on server
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          REGISTRY_USERNAME: ${{ secrets.PROD_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.PROD_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            if [ "$REGISTRY_HOST" = "ghcr.io" ]; then
              echo "No production registry credentials provided; assuming public GHCR images or existing server login."
              exit 0
            fi
            echo "Custom image registry requires PROD_REGISTRY_USERNAME and PROD_REGISTRY_PASSWORD secrets for server pull."
            exit 1
          fi

          SSH_HOST="${PROD_SSH_HOST:-cd-server}"
          printf '%s\n' "$REGISTRY_PASSWORD" | ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "docker login '$REGISTRY_HOST' -u '$REGISTRY_USERNAME' --password-stdin"

      - name: Deploy over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          PROD_API_PORT: ${{ vars.PROD_API_PORT }}
          PROD_WEB_STUDENT_PORT: ${{ vars.PROD_WEB_STUDENT_PORT }}
          PROD_WEB_ADMIN_PORT: ${{ vars.PROD_WEB_ADMIN_PORT }}
        run: |
          SSH_HOST="${PROD_SSH_HOST:-cd-server}"
          API_IMAGE="$API_IMAGE_REPOSITORY:$IMAGE_TAG"
          WEB_STUDENT_IMAGE="$WEB_STUDENT_IMAGE_REPOSITORY:$IMAGE_TAG"
          WEB_ADMIN_IMAGE="$WEB_ADMIN_IMAGE_REPOSITORY:$IMAGE_TAG"
          API_PORT="${PROD_API_PORT:-3000}"
          WEB_STUDENT_PORT="${PROD_WEB_STUDENT_PORT:-5173}"
          WEB_ADMIN_PORT="${PROD_WEB_ADMIN_PORT:-5174}"

          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' API_IMAGE='$API_IMAGE' WEB_STUDENT_IMAGE='$WEB_STUDENT_IMAGE' WEB_ADMIN_IMAGE='$WEB_ADMIN_IMAGE' API_PORT='$API_PORT' WEB_STUDENT_PORT='$WEB_STUDENT_PORT' WEB_ADMIN_PORT='$WEB_ADMIN_PORT' bash -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          git pull --ff-only origin main
          test -f .env || {
            echo "$DEPLOY_PATH/.env is required for production deployment"
            exit 1
          }
          cat > infra/.deploy-images.env <<EOF
          API_IMAGE=$API_IMAGE
          WEB_STUDENT_IMAGE=$WEB_STUDENT_IMAGE
          WEB_ADMIN_IMAGE=$WEB_ADMIN_IMAGE
          API_PORT=$API_PORT
          WEB_STUDENT_PORT=$WEB_STUDENT_PORT
          WEB_ADMIN_PORT=$WEB_ADMIN_PORT
          EOF
          compose_project_name="devops_ibooking"
          compose_env_args="--env-file .env --env-file infra/.deploy-images.env"
          docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml pull
          docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml up -d mysql
          docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml run --rm api ./node_modules/.bin/prisma migrate deploy
          docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml up -d

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null; then
              docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml ps
              exit 0
            fi
            sleep 2
          done

          docker compose -p "$compose_project_name" $compose_env_args -f infra/docker-compose.prod.yml logs --tail=120 api
          exit 1
          REMOTE
